spring:
  application:
    name: codeagent-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    default-property-inclusion: non_null

server:
  address: 127.0.0.1
  port: 8000

codeagent:
  session:
    directory: ${CODEAGENT_SESSION_DIRECTORY:../sessions}
  workspace:
    state-file: ${CODEAGENT_WORKSPACE_STATE_FILE:../workspaces/authorized-workspaces.json}
